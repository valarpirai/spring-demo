plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'org.sonarqube' version '5.1.0.4882'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

spotless {
	java {
		googleJavaFormat('1.22.0').aosp() // AOSP style uses 4-space indentation. Latest version as of June 2025
	}
}

sonarqube {
	properties {
		property 'sonar.projectKey', 'my-spring-boot-project'
		property 'sonar.projectName', 'My Spring Boot Project'
		property 'sonar.host.url', 'http://localhost:9000'
		property 'sonar.token', 'sqp_fa66b0120cdc5ff70a0ec45abd8baa4c052ff83f' // Replace with token from Step 2
		property 'sonar.java.source', '17'
		property 'sonar.sources', 'src/main/java'
		property 'sonar.tests', 'src/test/java'
		property 'sonar.sourceEncoding', 'UTF-8'
		property 'sonar.java.binaries', 'build/classes/java/main' // Required for Java analysis
	}
}

repositories {
	mavenCentral()
	mavenLocal() // Required to find the parent in the local repository
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	runtimeOnly 'mysql:mysql-connector-java:8.0.33'

	implementation 'org.springframework.kafka:spring-kafka'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// Spring Boot Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:junit-jupiter'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootRun {
	jvmArgs = ['-Xmx100m', '-XX:MaxDirectMemorySize=32m', '-XX:+HeapDumpOnOutOfMemoryError', '-XX:HeapDumpPath=build/dump.hprof', '-XX:+PrintFlagsFinal']
}

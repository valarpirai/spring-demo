spring.application.name=demo

spring.profiles.active=dev

spring.jpa.open-in-view=false

spring.datasource.url=jdbc:mysql://localhost:3306/rambo?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&nullDatabaseMeansCurrent=true&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.ErrorMvcAutoConfiguration
server.error.path=/error
server.tomcat.accesslog.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

spring.threads.virtual.enabled=true

spring.datasource.hikari.jdbcUrl=jdbc:mysql://localhost:3306/rambo?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&nullDatabaseMeansCurrent=true&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.hikari.username=root
spring.datasource.hikari.password=root
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=MyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.metrics-enabled=true

management.metrics.export.datadog.enabled=true
management.metrics.export.datadog.api-key=a32e2a9846051629ef75fce412382b53
management.metrics.export.datadog.step=10s
management.metrics.export.datadog.uri=https://us5.datadoghq.com
management.endpoints.web.exposure.include=metrics,health

management.datadog.metrics.export.apiKey=a32e2a9846051629ef75fce412382b53

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.topic=my-topic
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.dto
